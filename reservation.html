<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>RE:WIND 예약</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Julius+Sans+One&display=swap">
<style>
/* 레이아웃: 포스터 히어로 → 약장(평일 5열 × 10주 서랍)에서 날짜를 열고, 옆 수사 파일 패널에서 회차를 고른다. 예약 결과는 종이 접수증. */
:root{
  color-scheme:dark;
  --bg:#15100d;        /* 불 꺼진 한의원 */
  --panel:#1f1813;
  --wood:#3b2a1f;      /* 약장 나무 */
  --wood-hi:#553d2c;
  --wood-lo:#231810;
  --brass:#b9945c;     /* 서랍 고리 */
  --paper:#e8dccb;     /* 서랍 이름표·접수증 */
  --ink:#1d1611;
  --text:#eadfd2;
  --muted:#a5958a;
  --dusk:#9a8794;      /* 포스터 창밖의 보랏빛 */
  --ghost:#cfd9dc;     /* 차가운 흰빛 */
  --line:#3a2d25;
  --warn:#d98a6a;
  --f-display:"Julius Sans One","IBM Plex Sans KR",sans-serif;
  --f-story:"Gowun Batang","Noto Serif KR",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:15px;line-height:1.6;
  background-image:radial-gradient(120% 60% at 0% 0%,rgba(154,135,148,.16),transparent 60%),radial-gradient(80% 50% at 100% 30%,rgba(185,148,92,.08),transparent 70%);background-repeat:no-repeat}
.wrap{max-width:1060px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ghost);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}

/* 히어로 */
.hero{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:40px;align-items:end;padding-block:36px 44px}
.poster{position:relative;margin:0;border:1px solid var(--line);box-shadow:0 30px 60px -30px #000}
.poster img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(44px,8vw,84px);letter-spacing:.06em;line-height:1;margin:10px 0 0;white-space:nowrap}
.hero h1 i{display:inline-block;width:.05em;height:.82em;background:var(--ghost);margin-left:.1em;vertical-align:-.04em;animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tagline{font-family:var(--f-story);font-size:18px;margin:18px 0 0;color:var(--text)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:28px 0 0;padding-top:18px;border-top:1px solid var(--line)}
.facts dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--muted);padding-top:3px}
.facts dd{margin:0}
.times{display:flex;flex-wrap:wrap;gap:6px 14px}

.demo{background:var(--wood-lo);border:1px dashed var(--brass);color:var(--paper);padding:8px 14px;font-size:13px;margin-top:16px}

/* 본문 배치 */
.desk{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-areas:"cab acct" "cab slots";grid-template-rows:auto 1fr;gap:24px 32px;align-items:start;padding-bottom:48px}
#acct{grid-area:acct}#cab{grid-area:cab}#slots{grid-area:slots}
h2{font-family:var(--f-story);font-weight:700;font-size:20px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}

/* 약장 */
.cabinet{background:linear-gradient(#2c1f16,#1e150f);border:1px solid #0c0806;padding:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 30px 50px -30px #000}
.dow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:6px;text-align:center;font-family:var(--f-story);color:var(--muted);font-size:13px}
.dow span b{color:var(--brass);font-weight:400;margin-right:4px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.drawer{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px 7px;min-height:74px;
  background:linear-gradient(var(--wood-hi),var(--wood));border:1px solid #0e0906;border-top-color:#6a4d39;box-shadow:inset 0 0 0 2px rgba(0,0,0,.18);transition:transform .15s,box-shadow .15s}
.drawer .tag{background:var(--paper);color:var(--ink);font-family:var(--f-story);font-weight:700;font-size:13px;line-height:1;padding:4px 6px 3px;min-width:42px;text-align:center}
.drawer .ring{width:13px;height:13px;border:2px solid var(--brass);border-radius:50%;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.drawer .pips{display:flex;gap:3px}
.drawer .pips i{width:5px;height:5px;border-radius:50%;background:var(--paper)}
.drawer .pips i.x{background:transparent;box-shadow:inset 0 0 0 1px #7a6657}
.drawer:hover:not(:disabled){transform:translateY(2px)}
.drawer[aria-pressed="true"]{transform:translateY(5px);box-shadow:0 -5px 0 #0c0806,0 10px 18px -6px #000,inset 0 0 0 1px var(--ghost)}
.drawer:disabled{cursor:default;background:var(--wood-lo);border-top-color:#2e2018}
.drawer:disabled .tag{background:#6e6156;color:#2a211b}
.drawer:disabled .ring{border-color:#5b4a35}
.drawer.mine .tag{background:var(--ghost)}
.drawer.mine::after{content:"내 예약";position:absolute;top:-7px;right:-3px;background:var(--ghost);color:var(--ink);font-size:10px;padding:0 5px;line-height:15px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--paper);margin-right:6px}
.legend i.x{background:transparent;box-shadow:inset 0 0 0 1px #7a6657}

/* 패널 */
.panel{background:var(--panel);border:1px solid var(--line);padding:20px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted)}
input[type=text],input[type=email],input[type=password],select{background:var(--bg);border:1px solid var(--line);padding:10px 12px;width:100%;border-radius:0}
input:focus,select:focus{border-color:var(--brass);outline:none}
.btn{background:var(--paper);color:var(--ink);border:0;padding:10px 16px;font-weight:600}
.btn:hover{background:#fff}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:400}
.btn.ghost:hover{border-color:var(--muted);background:transparent}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.msg{font-size:13px;color:var(--warn);min-height:20px;margin:8px 0 0}
.msg.ok{color:var(--ghost)}

/* 접수증 */
.slip{background:var(--paper);color:var(--ink);padding:20px 20px 16px;position:relative;font-family:var(--f-story)}
.slip::before{content:"";position:absolute;inset:6px;border:1px solid rgba(29,22,17,.35);pointer-events:none}
.slip .label{color:#6b5a4c}
.slip .when{font-size:26px;font-weight:700;line-height:1.25;margin:6px 0 2px}
.slip .who{margin:0 0 14px;font-size:14px}
.slip .row{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.slip .btn{background:var(--ink);color:var(--paper);font-family:var(--f-ui)}
.slip .btn.danger{background:transparent;color:#8a3a22;border-color:#8a3a22}
.who-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.who-bar b{color:var(--text);font-weight:500}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:13px}

/* 회차 */
.file-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px}
.file-head .d{font-family:var(--f-story);font-size:20px;font-weight:700}
.slot{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.1em}
.slot .t{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.slot .st{font-size:13px;color:var(--muted)}
.slot.off .t{color:#6e6156;text-decoration:line-through}
.slot.me .st{color:var(--ghost)}

.bookform{padding:14px;margin:0 0 12px;background:var(--bg);border:1px solid var(--line)}
.bookform input[type=tel]{background:var(--panel);border:1px solid var(--line);padding:11px 12px;width:100%;border-radius:0;font-size:16px}
.bookform .btn{width:100%;margin-top:12px;padding:12px}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer;padding:4px 0}
.agree input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:var(--brass)}
.terms{font-size:13px;color:var(--muted);margin:4px 0 0 30px}
.terms summary{cursor:pointer;text-decoration:underline}
.terms dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0}
.terms dd{margin:0;color:var(--text)}.terms p{margin:0}
/* 안내 */
.notes{border-top:1px solid var(--line);padding-block:32px 20px}
.notes ul{margin:12px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 32px}
.notes li{padding-left:14px;border-left:1px solid var(--brass);font-size:14px;color:var(--text)}
.notes li b{display:block;font-family:var(--f-story)}
footer{padding-block:20px 40px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--muted)}

/* 관리자 */
.admin{padding-block:28px 48px}
.admin h1{font-family:var(--f-display);font-weight:400;letter-spacing:.06em;font-size:30px;margin:0 0 4px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:400}
tr:last-child td{border-bottom:0}
td .btn{margin-right:4px}
.stat{display:flex;gap:28px;flex-wrap:wrap;margin:18px 0}
.stat div b{display:block;font-family:var(--f-mono);font-size:26px;font-weight:400}
.stat div span{font-size:12px;color:var(--muted)}
.admin section{margin-top:32px}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border:1px solid var(--line);color:var(--muted)}
.pill.b{border-color:var(--warn);color:var(--warn)}
.pill.r{border-color:var(--ghost);color:var(--ghost)}

@media (max-width:820px){
  .hero{grid-template-columns:1fr;gap:22px;padding-block:20px 32px}
  .desk{grid-template-columns:1fr;grid-template-areas:"acct" "cab" "slots";grid-template-rows:auto}
  .cabinet{padding:7px}.grid,.dow{gap:4px}
  input[type=text],input[type=email],input[type=password],select{font-size:16px}
  .slot .btn.sm{padding:9px 12px}
  .slot{gap:10px}
}
@media (prefers-reduced-motion:reduce){.hero h1 i{animation:none}.drawer{transition:none}}
</style>

<div id="app"></div>

<script>
/* ============================================================
   설정 — 운영 전에 이 부분만 고치면 됩니다
   ============================================================ */
const CONFIG = {
  start: '2026-11-23',            // 11월 4주차 월요일
  end:   '2027-01-29',            // 1월 마지막 금요일
  closed: ['2026-12-25', '2027-01-01'],     // 휴관일 (성탄절·신정)
  times: ['11:00', '13:30', '16:00', '19:30'],
  openAt: null,                   // 예약 오픈 시각. 예: '2026-11-16T20:00' (한국 시간). null이면 바로 오픈
  changeDeadline: null,           // 변경·취소 마감. 예: '2026-12-31T23:59'. null이면 회차 시작 전까지
  keepUntil: '2027년 2월 28일',     // 연락처 보관 기한 (동의문에 표시)
  collector: '미스터리게임즈',
  place: '서울 마포구 연남로 4-1 3층',
  placeNote: '홍대입구역 3번 출구 도보 5분 · 주차 불가',
  // Firebase 프로젝트 설정을 붙여 넣으면 실제 예약이 저장됩니다. 비워 두면 이 브라우저에만 저장되는 미리보기 모드.
  firebase: { apiKey: '', authDomain: '', projectId: '', appId: '' },
};
/* 후원자 명단: ['후원번호 8자리', '닉네임'] */
const BACKERS = [
  ['12345678', '테스트'],
];
/* Firestore 보안 규칙 (콘솔 > Firestore > 규칙에 붙여 넣기)
   match /rewind_slots/{id} {
     allow read: if true;
     allow create: if request.auth != null || !('blocked' in request.resource.data);
     allow update: if request.auth != null;
     allow delete: if request.auth != null || !('blocked' in resource.data);
   }
   match /rewind_backers/{id} { allow read, write: if true; }
   match /rewind_contacts/{id} {            // 휴대전화번호: 관리자만 볼 수 있음
     allow create, delete: if true;
     allow read, update: if request.auth != null;
   }
   관리자 계정은 Authentication > 이메일/비밀번호로 1개 만들어 둡니다. */

/* ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DOW = ['일','월','화','수','목','금','토'];
const pad = n => String(n).padStart(2, '0');
const nowKST = () => { const d = new Date(Date.now() + 9 * 3600e3); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}T${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; };
const sid = (date, time) => `${date}_${time.replace(':', '')}`;
const sidDate = id => id.slice(0, 10);
const sidTime = id => id.slice(11, 13) + ':' + id.slice(13);
const fmtPhone = p => { p = String(p || ''); return p.length === 11 ? `${p.slice(0,3)}-${p.slice(3,7)}-${p.slice(7)}` : p.length === 10 ? `${p.slice(0,3)}-${p.slice(3,6)}-${p.slice(6)}` : p; };
const fmtDate = date => { const [y, m, d] = date.split('-').map(Number); return `${m}월 ${d}일 (${DOW[new Date(Date.UTC(y, m-1, d)).getUTCDay()]})`; };

// 운영일 목록 (월~금)
const DAYS = (() => {
  const out = []; const [y, m, d] = CONFIG.start.split('-').map(Number);
  for (let t = Date.UTC(y, m-1, d); ; t += 864e5) {
    const x = new Date(t); const s = `${x.getUTCFullYear()}-${pad(x.getUTCMonth()+1)}-${pad(x.getUTCDate())}`;
    if (s > CONFIG.end) break;
    const w = x.getUTCDay(); if (w >= 1 && w <= 5) out.push({ date: s, closed: CONFIG.closed.includes(s) });
  }
  return out;
})();
const OPEN_DAYS = DAYS.filter(d => !d.closed);
const ALL_IDS = OPEN_DAYS.flatMap(d => CONFIG.times.map(t => sid(d.date, t)));

/* ---------- 저장소: Firebase 또는 미리보기(이 브라우저) ---------- */
function demoStore() {
  let map = {}; const subs = [];
  try { map = JSON.parse(localStorage.getItem('rewind-demo') || 'null') || null; } catch (e) { map = null; }
  if (!map) { // 예시 데이터
    map = {};
    [[2,1,'예시·달무리'],[2,3,'예시·감초'],[5,0,'예시·홍연'],[5,1,'예시·서랍지기'],[5,2,'예시·야근조'],[5,3,'예시·삼인조'],[9,2,'예시·당귀']].forEach(([di, ti, nick], i) => {
      map[sid(OPEN_DAYS[di].date, CONFIG.times[ti])] = { no: '0000000' + i, nick, at: Date.now() };
    });
    map[sid(OPEN_DAYS[7].date, CONFIG.times[0])] = { blocked: true };
  }
  const emit = () => { try { localStorage.setItem('rewind-demo', JSON.stringify(map)); } catch (e) {} subs.forEach(f => f({ ...map })); };
  const mineOf = no => Object.keys(map).find(k => map[k].no === no);
  return {
    demo: true,
    subscribe(cb) { subs.push(cb); cb({ ...map }); },
    async book(id, u, phone) { if (map[id]) throw new Error('TAKEN'); const prev = mineOf(u.no); if (prev) delete map[prev]; map[id] = { no: u.no, nick: u.nick, phone, at: Date.now() }; emit(); },
    watchContacts() {},
    async cancel(id, u) { if (map[id] && map[id].no === u.no) delete map[id]; emit(); },
    async adminCancel(id) { delete map[id]; emit(); },
    async adminMove(from, to) { if (map[to]) throw new Error('TAKEN'); map[to] = map[from]; delete map[from]; emit(); },
    async adminBlock(ids, on) { ids.forEach(id => { if (on) { if (!map[id]) map[id] = { blocked: true }; } else if (map[id] && map[id].blocked) delete map[id]; }); emit(); },
    onAuth(cb) { this._auth = cb; cb(false); },
    async login() { this._auth(true); },
    async logout() { this._auth(false); },
  };
}
function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('LOAD')); document.head.appendChild(s); }); }
async function firebaseStore(cfg) {
  const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
  await loadScript(V + 'firebase-app-compat.js'); await loadScript(V + 'firebase-firestore-compat.js'); await loadScript(V + 'firebase-auth-compat.js');
  firebase.initializeApp(cfg);
  const db = firebase.firestore(), auth = firebase.auth(), S = db.collection('rewind_slots'), B = db.collection('rewind_backers'), C = db.collection('rewind_contacts');
  return {
    demo: false,
    subscribe(cb) { S.onSnapshot(q => { const m = {}; q.forEach(d => m[d.id] = d.data()); cb(m); }, e => cb(null, e)); },
    watchContacts(cb) { if (this._w) return; this._w = C.onSnapshot(q => { const m = {}; q.forEach(d => m[d.id] = d.data()); cb(m); }, () => { this._w = null; }); },
    book(id, u, phone) { return db.runTransaction(async t => {
      const sr = S.doc(id), br = B.doc(u.no); const s = await t.get(sr), b = await t.get(br);
      if (s.exists) throw new Error('TAKEN');
      const prev = b.exists && b.data().slot; let pr = null, p = null;
      if (prev && prev !== id) { pr = S.doc(prev); p = await t.get(pr); }
      if (p && p.exists && p.data().no === u.no) { t.delete(pr); t.delete(C.doc(prev)); }
      t.set(sr, { no: u.no, nick: u.nick, at: Date.now() }); t.set(br, { slot: id });
      t.set(C.doc(id), { phone, no: u.no, nick: u.nick, agreedAt: Date.now() });
    }); },
    cancel(id, u) { return db.runTransaction(async t => { const sr = S.doc(id), s = await t.get(sr); if (s.exists && s.data().no === u.no) { t.delete(sr); t.delete(C.doc(id)); } t.delete(B.doc(u.no)); }); },
    async adminCancel(id, rec) { const b = db.batch(); b.delete(S.doc(id)); b.delete(C.doc(id)); if (rec && rec.no) b.delete(B.doc(rec.no)); await b.commit(); },
    adminMove(from, to, rec) { return db.runTransaction(async t => { const tr = S.doc(to); if ((await t.get(tr)).exists) throw new Error('TAKEN'); const c = await t.get(C.doc(from)); if (c.exists) { t.set(C.doc(to), c.data()); t.delete(C.doc(from)); } t.delete(S.doc(from)); t.set(tr, rec); t.set(B.doc(rec.no), { slot: to }); }); },
    async adminBlock(ids, on, map) { const b = db.batch(); ids.forEach(id => { if (on) { if (!map[id]) b.set(S.doc(id), { blocked: true }); } else if (map[id] && map[id].blocked) b.delete(S.doc(id)); }); await b.commit(); },
    onAuth(cb) { auth.onAuthStateChanged(u => cb(!!u)); },
    login(email, pw) { return auth.signInWithEmailAndPassword(email, pw); },
    logout() { return auth.signOut(); },
  };
}

/* ---------- 상태 ---------- */
const st = { store: null, slots: {}, loaded: false, err: '', user: null, day: null, msg: '', msgOk: false, arm: '', admin: false, aDay: OPEN_DAYS[0].date, moving: '', phone: '', contacts: {} };
try { const u = JSON.parse(sessionStorage.getItem('rewind-user') || 'null'); if (u && BACKERS.some(b => b[0] === u.no && b[1] === u.nick)) st.user = u; } catch (e) {}

const slotState = id => {
  const r = st.slots[id];
  if (r && r.blocked) return 'blocked';
  if (r) return st.user && r.no === st.user.no ? 'mine' : 'taken';
  if (`${sidDate(id)}T${sidTime(id)}` <= nowKST()) return 'past';
  return 'free';
};
const myId = () => st.user ? Object.keys(st.slots).find(k => st.slots[k].no === st.user.no) : null;
const isOpen = () => !CONFIG.openAt || nowKST() >= CONFIG.openAt;
const canChange = id => (!CONFIG.changeDeadline || nowKST() <= CONFIG.changeDeadline) && `${sidDate(id)}T${sidTime(id)}` > nowKST();
const firstDay = () => { const m = myId(); if (m) return sidDate(m); const d = OPEN_DAYS.find(d => CONFIG.times.some(t => slotState(sid(d.date, t)) === 'free')); return d ? d.date : OPEN_DAYS[0].date; };

  const drawers = DAYS.map(d => {

    const isMine = states.includes('mine');

    return `<button class="drawer${isMine ? ' mine' : ''}" data-day="${d.date}" aria-pressed="${st.day === d.date}" ${dead ? 'disabled' : ''} aria-label="${fmtDate(d.date)}, 예약 가능 ${free}회차">

      <div class="grid">${drawers}</div>
    </div>
    <div class="legend"><span><i></i>예약 가능한 회차</span><span><i class="x"></i>마감된 회차</span><span>休 휴관</span></div>`;

  const open = isOpen();
  const slots = `
    <div class="panel">
      <div class="file-head"><span class="d">${fmtDate(st.day)}</span><span class="label">회차 선택</span></div>
      ${!st.loaded ? `<p class="sub" style="margin:14px 0 0">${st.err ? esc(st.err) : '예약 현황을 불러오는 중입니다.'}</p>` : CONFIG.times.map((t, i) => {
        const id = sid(st.day, t), s = slotState(id);
        const label = { free: '예약 가능', taken: '예약 마감', blocked: '운영하지 않는 회차', past: '종료', mine: '내 예약' }[s];
        let action = '';
        if (s === 'free') {
          if (!open) action = `<span class="st">오픈 전</span>`;
          else if (!st.user) action = `<button class="btn ghost sm" data-act="needLogin">후원자 확인 후 예약</button>`;
          else if (mine && !canChange(mine)) action = '';
          else action = `<button class="btn sm ${st.arm === id ? 'ghost' : ''}" data-act="book" data-id="${id}">${st.arm === id ? '닫기' : (mine ? '이 회차로 변경' : '예약')}</button>`;
        }
        return `<div class="slot ${s === 'free' ? '' : s === 'mine' ? 'me' : 'off'}"><span class="n">${i + 1}회차</span><span><span class="t">${t}</span> <span class="st">· ${label}</span></span><span>${action}</span></div>${st.arm === id && s === 'free' ? bookForm(id, !!mine) : ''}`;
      }).join('')}
      ${!open ? `<p class="sub" style="margin:12px 0 0">예약은 ${esc(CONFIG.openAt.replace('T', ' '))}에 열립니다.</p>` : ''}
    </div>`;

  return `${hero}
  <main class="wrap desk"><section id="acct">${acct}</section><section id="cab">${cab}</section><section id="slots">${slots}</section></main>
  <section class="wrap notes">
    <h2>안내</h2>
    <ul>
      <li><b>3인 전용 테마</b>한 회차에 한 팀만 진행합니다. 세 분이 함께 와 주세요.</li>
      <li><b>예약 변경과 취소</b>이 페이지에서 직접 할 수 있습니다. 회차가 시작된 뒤에는 바꿀 수 없습니다.</li>
      <li><b>휴관</b>주말과 12월 25일, 1월 1일은 운영하지 않습니다.</li>
      <li><b>오시는 길</b>${esc(CONFIG.place)}<br>${esc(CONFIG.placeNote)}</li>
      <li><b>문의</b>텀블벅 메시지로 보내 주세요.</li>
    </ul>
  </section>
  <footer class="wrap"><span>MYSTERY GAMES · RE:WIND</span><a href="#admin">관리자</a></footer>`;
}

/* ---------- 관리자 화면 ---------- */
function viewAdmin() {
  if (!st.admin) return `
  <main class="wrap admin" style="max-width:420px">
    <h1>RE:WIND</h1><p class="sub">관리자 페이지</p>
    <form class="panel" id="adminForm">
      ${st.store.demo ? `<p class="sub">미리보기 모드에서는 로그인 없이 열립니다.</p>` : `
      <div class="field"><label for="aEmail">이메일</label><input type="email" id="aEmail" autocomplete="username"></div>
      <div class="field"><label for="aPw">비밀번호</label><input type="password" id="aPw" autocomplete="current-password"></div>`}
      <button class="btn" type="submit">${st.store.demo ? '관리자 화면 열기' : '로그인'}</button>
      <p class="msg" id="adminMsg" role="alert"></p>
    </form>
    <p style="margin-top:16px"><a href="#" style="color:var(--muted)">예약 화면으로</a></p>
  </main>`;

  const booked = ALL_IDS.filter(id => st.slots[id] && !st.slots[id].blocked);
  const blocked = ALL_IDS.filter(id => st.slots[id] && st.slots[id].blocked);
  const freeIds = ALL_IDS.filter(id => !st.slots[id] && `${sidDate(id)}T${sidTime(id)}` > nowKST());
  const moveOpts = id => `<select id="mv-${id}" aria-label="옮길 회차"><option value="">옮길 회차 선택</option>${freeIds.map(f => `<option value="${f}">${fmtDate(sidDate(f))} ${sidTime(f)}</option>`).join('')}</select>`;

  const rows = booked.map(id => { const r = st.slots[id]; return `<tr>
      <td>${fmtDate(sidDate(id))}</td><td class="mono">${sidTime(id)}</td><td>${esc(r.nick)}</td><td class="mono">${esc(r.no)}</td><td class="mono">${esc(fmtPhone((st.contacts[id] || r).phone) || '-')}</td>
      <td>${st.moving === id ? `${moveOpts(id)} <button class="btn sm" data-act="aMoveGo" data-id="${id}">옮기기</button> <button class="btn ghost sm" data-act="aMove" data-id="">닫기</button>` :
        `<button class="btn ghost sm" data-act="aMove" data-id="${id}">변경</button><button class="btn danger sm" data-act="aCancel" data-id="${id}">${st.arm === 'a' + id ? '한 번 더 누르면 취소' : '취소'}</button>`}</td></tr>`; }).join('');

  const dayRows = CONFIG.times.map((t, i) => { const id = sid(st.aDay, t), r = st.slots[id];
    return `<tr><td>${i + 1}회차</td><td class="mono">${t}</td>
      <td>${r ? (r.blocked ? `<span class="pill b">차단</span>` : `<span class="pill r">예약</span> ${esc(r.nick)} <span class="mono">${esc(r.no)}</span>`) : `<span class="pill">비어 있음</span>`}</td>
      <td>${r ? (r.blocked ? `<button class="btn ghost sm" data-act="aBlock" data-on="0" data-ids="${id}">차단 해제</button>` : '') : `<button class="btn ghost sm" data-act="aBlock" data-on="1" data-ids="${id}">차단</button>`}</td></tr>`; }).join('');
  const dayIds = CONFIG.times.map(t => sid(st.aDay, t)).join(',');

  return `
  <main class="wrap admin">
    <div class="bar" style="justify-content:space-between;margin:0"><div><h1>RE:WIND</h1><p class="sub" style="margin:0">관리자 페이지${st.store.demo ? ' · 미리보기 모드' : ''}</p></div>
      <div><a href="#" class="btn ghost sm" style="text-decoration:none">예약 화면</a> <button class="btn ghost sm" data-act="aLogout">로그아웃</button></div></div>
    <div class="stat"><div><b>${booked.length}</b><span>예약된 회차</span></div><div><b>${blocked.length}</b><span>차단한 회차</span></div><div><b>${ALL_IDS.length}</b><span>전체 회차 (${OPEN_DAYS.length}일 × ${CONFIG.times.length})</span></div></div>
    <p class="msg ${st.msgOk ? 'ok' : ''}" role="status">${esc(st.msg)}</p>

    <section><h2>날짜별 회차 관리</h2>
      <div class="bar"><select id="aDay" style="width:auto" aria-label="날짜">${OPEN_DAYS.map(d => { const n = CONFIG.times.filter(t => { const r = st.slots[sid(d.date, t)]; return r && !r.blocked; }).length; return `<option value="${d.date}" ${d.date === st.aDay ? 'selected' : ''}>${fmtDate(d.date)}${n ? ` · 예약 ${n}` : ''}</option>`; }).join('')}</select>
        <button class="btn ghost sm" data-act="aBlock" data-on="1" data-ids="${dayIds}">이 날 빈 회차 차단</button><button class="btn ghost sm" data-act="aBlock" data-on="0" data-ids="${dayIds}">이 날 차단 해제</button></div>
      <div class="tbl-wrap"><table><thead><tr><th>회차</th><th>시간</th><th>상태</th><th></th></tr></thead><tbody>${dayRows}</tbody></table></div>
      <div class="bar"><span class="sub" style="margin:0">전체 기간</span><button class="btn ghost sm" data-act="aBlock" data-on="1" data-ids="ALL">예약 없는 회차 일괄 차단</button><button class="btn ghost sm" data-act="aBlock" data-on="0" data-ids="ALL">일괄 해제</button></div>
    </section>

    <section><h2>전체 예약 ${booked.length}건</h2>
      ${booked.length ? `<div class="tbl-wrap"><table><thead><tr><th>날짜</th><th>시간</th><th>닉네임</th><th>후원번호</th><th>연락처</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : `<p class="sub">아직 예약이 없습니다.</p>`}
    </section>
  </main>`;
}

/* ---------- 렌더·이벤트 ---------- */
const app = $('#app');
function render() {
  const keep = {}, chk = {}; app.querySelectorAll('input').forEach(i => { keep[i.id] = i.value; chk[i.id] = i.checked; });
  const termsOpen = !!app.querySelector('details.terms[open]');
  const focus = document.activeElement && document.activeElement.id;
  const y = window.scrollY;
  app.innerHTML = !st.store ? `<div class="wrap" style="padding-block:60px;color:var(--muted)">${st.err ? esc(st.err) : '불러오는 중입니다.'}</div>` : (location.hash === '#admin' ? viewAdmin() : viewBooking());
  Object.keys(keep).forEach(id => { const el = id && document.getElementById(id); if (el) { if (el.type === 'checkbox') el.checked = chk[id]; else el.value = keep[id]; } });
  if (termsOpen) { const t = app.querySelector('details.terms'); if (t) t.open = true; }
  if (focus) { const el = document.getElementById(focus); if (el) el.focus(); }
  window.scrollTo(0, y);
}
const say = (m, ok) => { st.msg = m; st.msgOk = !!ok; };
const errText = e => e && e.message === 'TAKEN' ? '방금 다른 분이 먼저 예약한 회차입니다. 다른 회차를 골라 주세요.' : '저장하지 못했습니다. 연결 상태를 확인하고 다시 시도해 주세요.';

app.addEventListener('click', async e => {
  const d = e.target.closest('[data-day]'); if (d) { st.day = d.dataset.day; st.arm = ''; render(); if (matchMedia('(max-width:820px)').matches) $('#slots').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  try {
    if (act === 'logout') { st.user = null; say(''); try { sessionStorage.removeItem('rewind-user'); } catch (x) {} }
    else if (act === 'needLogin') { render(); $('#acct').scrollIntoView({ behavior: 'smooth', block: 'center' }); $('#fNo').focus(); return; }
    else if (act === 'book') {
      st.arm = st.arm === id ? '' : id; say(''); render(); const f = $('#fPhone'); if (f) f.focus(); return;
    }
    else if (act === 'cancel') {
      if (st.arm !== 'cancel') st.arm = 'cancel';
      else { st.arm = ''; await st.store.cancel(myId(), st.user); say('예약을 취소했습니다.', true); }
    }
    else if (act === 'aLogout') { await st.store.logout(); }
    else if (act === 'aMove') { st.moving = id; }
    else if (act === 'aMoveGo') { const to = $('#mv-' + id).value; if (!to) say('옮길 회차를 골라 주세요.'); else { await st.store.adminMove(id, to, st.slots[id]); st.moving = ''; say('예약을 옮겼습니다.', true); } }
    else if (act === 'aCancel') { if (st.arm !== 'a' + id) st.arm = 'a' + id; else { st.arm = ''; await st.store.adminCancel(id, st.slots[id]); say('예약을 취소했습니다.', true); } }
    else if (act === 'aBlock') {
      const on = b.dataset.on === '1'; let ids = b.dataset.ids === 'ALL' ? ALL_IDS : b.dataset.ids.split(',');
      await st.store.adminBlock(ids, on, st.slots); say(on ? '빈 회차를 차단했습니다.' : '차단을 해제했습니다.', true);
    }
  } catch (x) { say(errText(x)); }
  render();
});
app.addEventListener('change', e => { if (e.target.id === 'aDay') { st.aDay = e.target.value; render(); } });
app.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'loginForm') {
    const no = $('#fNo').value.trim(), nick = $('#fNick').value.trim();
    if (!/^\d{8}$/.test(no)) { $('#loginMsg').textContent = '후원번호는 숫자 8자리입니다.'; return; }
    if (!BACKERS.some(b => b[0] === no && b[1] === nick)) { $('#loginMsg').textContent = '명단에서 찾지 못했습니다. 후원번호와 닉네임을 다시 확인해 주세요.'; return; }
    st.user = { no, nick }; st.day = null; say('');
    try { sessionStorage.setItem('rewind-user', JSON.stringify(st.user)); } catch (x) {}
    render();
  } else if (e.target.id === 'bookForm') {
    const id = e.target.dataset.id, phone = $('#fPhone').value.replace(/\D/g, ''), m = $('#bookMsg');
    if (!/^01[016789]\d{7,8}$/.test(phone)) { m.textContent = '휴대전화번호를 확인해 주세요. 예: 010-1234-5678'; return; }
    if (!$('#fAgree').checked) { m.textContent = '개인정보 수집·이용에 동의해야 예약할 수 있습니다.'; return; }
    const had = myId(), btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
    try { await st.store.book(id, st.user, phone); st.phone = phone; st.arm = ''; say(`${fmtDate(sidDate(id))} ${sidTime(id)} 회차로 ${had ? '변경했습니다.' : '예약했습니다.'}`, true); render(); if (matchMedia('(max-width:820px)').matches) $('#acct').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    catch (x) { btn.disabled = false; m.textContent = errText(x); }
  } else if (e.target.id === 'adminForm') {
    try { await st.store.login($('#aEmail') && $('#aEmail').value.trim(), $('#aPw') && $('#aPw').value); }
    catch (x) { $('#adminMsg').textContent = '로그인하지 못했습니다. 이메일과 비밀번호를 확인해 주세요.'; }
  }
});
window.addEventListener('hashchange', () => { say(''); st.arm = ''; render(); window.scrollTo(0, 0); });

(async () => {
  render();
  try { st.store = CONFIG.firebase.apiKey ? await firebaseStore(CONFIG.firebase) : demoStore(); }
  catch (e) { st.err = '예약 서버에 연결하지 못했습니다. 잠시 후 새로고침해 주세요.'; render(); return; }
  st.store.onAuth(ok => { st.admin = ok; if (ok) st.store.watchContacts(m => { st.contacts = m; render(); }); render(); });
  st.store.subscribe((m, err) => { if (err) { st.err = '예약 현황을 불러오지 못했습니다. 새로고침해 주세요.'; } else { st.slots = m; st.loaded = true; } render(); });
  setInterval(render, 60000);
})();
</script>

</body>
</html>
